version: "3.8"

services:
  zomboid-dedicated-server:
    build:
      context: .
      dockerfile: docker/zomboid-dedicated-server.Dockerfile
    image: "docker.io/renegademaster/zomboid-dedicated-server:latest"
    container_name: zomboid-dedicated-server
    restart: "no"
    environment:
      - "ADMIN_PASSWORD=changeme"
      - "ADMIN_USERNAME=superuser"
      - "AUTOSAVE_INTERVAL=15"
      - "BIND_IP=0.0.0.0"
      - "DEFAULT_PORT=16261"
      - "GAME_VERSION=public"
      - "GC_CONFIG=ZGC"
      - "MAP_NAMES=Muldraugh, KY"
      - "MAX_PLAYERS=16"
      - "MAX_RAM=4096m"
      - "MOD_NAMES="
      - "MOD_WORKSHOP_IDS="
      - "PAUSE_ON_EMPTY=true"
      - "PORTAL_ADMIN_PASSWORD=changeme_portal"
      - "PORTAL_ADMIN_USERNAME=admin"
      - "PORTAL_AUTH_PROVIDER=local"
      - "PORTAL_AUTO_START=true"
      - "PORTAL_DB_PATH=/home/steam/Zomboid/portal/portal.sqlite"
      - "PORTAL_HOST=0.0.0.0"
      - "PORTAL_LOG_LINES=1000"
      - "PORTAL_PORT=8080"
      - "PORTAL_ALLOWED_USERS="
      - "PORTAL_ALLOWED_EMAILS="
      - "PORTAL_ALLOWED_GROUPS="
      - "PORTAL_OPERATOR_GROUPS="
      - "PORTAL_ADMIN_GROUPS="
      - "PORTAL_READ_ONLY_GROUPS="
      - "PORTAL_USERNAME_CLAIM=preferred_username"
      - "PORTAL_EMAIL_CLAIM=email"
      - "PORTAL_GROUPS_CLAIM=groups"
      - "PORTAL_PUBLIC_DESCRIPTION="
      - "PORTAL_PUBLIC_SERVER_NAME=Project Zomboid Server"
      - "PORTAL_RCON_BINARY=rcon"
      - "PORTAL_RCON_HOST="
      - "PORTAL_RCON_HOST_FILE=/home/steam/Zomboid/ip.txt"
      - "PORTAL_SAFE_ACTION_COUNTDOWN_SECONDS=300"
      # Set to true when the portal is served through HTTPS, for example behind Apache or another reverse proxy.
      - "PORTAL_SECURE_COOKIES=false"
      - "PORTAL_SESSION_COOKIE=pz_portal_session"
      - "PORTAL_SESSION_SECRET=change_this_portal_session_secret"
      - "PORTAL_SESSION_TTL_SECONDS=43200"
      # OIDC/OAuth2 settings are intentionally omitted here so local auth boots cleanly.
      # To use external auth, set PORTAL_AUTH_PROVIDER and provide a complete OIDC or OAuth2 configuration.
      - "PUBLIC_SERVER=true"
      - "RCON_PASSWORD=changeme_rcon"
      - "RCON_PORT=27015"
      - "SERVER_NAME=ZomboidServer"
      - "SERVER_PASSWORD="
      - "STEAM_VAC=true"
      - "UDP_PORT=16262"
      - "USE_STEAM=true"
      - "TZ=UTC"
    ports:
      - target: 16261
        published: 16261
        protocol: udp
      - target: 16262
        published: 16262
        protocol: udp
      - target: 27015
        published: 27015
        protocol: tcp
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - ./ZomboidDedicatedServer:/home/steam/ZomboidDedicatedServer
      - ./ZomboidConfig:/home/steam/Zomboid/
